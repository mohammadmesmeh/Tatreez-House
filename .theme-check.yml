# Theme Check configuration — Tatreez House (Dawn-based custom theme).
#
# MatchingTranslations is disabled on purpose (feature 001-homepage-hero):
# this theme ships the Shopify-default locale set that Dawn bundles (28+ languages)
# plus ONE additional language (Arabic: locales/ar.json + locales/ar.schema.json,
# carrying the hero section's translated keys). Shopify falls back to the default
# locale for any key missing in a language file, so partial language files are
# functionally correct at runtime and in the theme editor.
#
# With the check enabled, adding sections.hero.* to en.default*.json flags ~2500
# "translation missing" errors across the28 unused Dawn languages, and the Arabic
# files flag ~1500 missing Dawn keys — noise with no product impact. Re-enable by
# deleting this file once every shipped language is fully translated.
MatchingTranslations:
  enabled: false
